<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register User Vault - SecureCloud Monitor</title>
  <meta name="description" content="Create a new SecureCloud Monitor user file vault account.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔒</div>
      <h1 style="font-size: 22px; margin-bottom: 6px;">Create User Account</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Encrypted Storage & Activity Tracing</p>
    </div>

    <!-- Registration Form -->
    <form id="register-form">
      <div class="form-group">
        <label for="reg-username" class="form-label">Username</label>
        <input type="text" id="reg-username" class="form-control" placeholder="Choose username (3-50 chars)" required minlength="3" maxlength="50" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="reg-email" class="form-label">Work Email</label>
        <input type="email" id="reg-email" class="form-control" placeholder="name@company.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="reg-password" class="form-label">Password</label>
        <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="reg-confirm-password" class="form-label">Confirm Password</label>
        <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
      </div>

      <div style="font-size: 11.5px; color: var(--text-muted); margin-bottom: 18px; line-height: 1.4;">
        🔒 Security Note: Passwords are encrypted with 10-round bcrypt. User accounts operate in isolated sandbox containers.
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Create Security Account
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary);">
      Already have an account? <a href="/login.html">Sign In</a>
    </div>

    <div style="margin-top: 16px; text-align: center;">
      <a href="/" style="font-size: 12px; color: var(--text-muted);">← Return to Platform Overview</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initRegisterPage);
  </script>
</body>
</html>
