<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - SecureCloud Monitor</title>
  <meta name="description" content="Sign in to SecureCloud Monitor SOC console or User File Vault.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🛡️</div>
      <h1 style="font-size: 22px; margin-bottom: 6px;">SecureCloud Sign In</h1>
      <p style="color: var(--text-muted); font-size: 13px;">Security Operations Center & User Vault</p>
    </div>

    <!-- Demo Credentials Quick-Fill -->
    <div class="demo-credentials-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-weight: 700; color: var(--cyber-cyan);">Default Administrator</span>
        <button type="button" id="btn-fill-demo" class="btn btn-outline btn-sm" style="padding: 2px 8px; font-size: 11px;">
          Auto-Fill
        </button>
      </div>
      <div style="color: var(--text-secondary); font-size: 11.5px;">
        Username: <code style="color: #FFF;">admin</code> &bull; Password: <code style="color: #FFF;">Admin@12345</code>
      </div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Username or Email</label>
        <input type="text" id="username" class="form-control" placeholder="Enter username or email" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Authenticate & Sign In
      </button>
    </form>

    <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary);">
      Need a user account? <a href="/register.html">Register User Vault</a>
    </div>

    <div style="margin-top: 16px; text-align: center;">
      <a href="/" style="font-size: 12px; color: var(--text-muted);">← Return to Platform Overview</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initLoginPage);
  </script>
</body>
</html>
